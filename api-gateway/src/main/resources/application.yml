server:
  port: 8080

spring:
  application:
    name: api-gateway

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-key-please-change-in-production}
  expiration: 3600000  # 1 hour in milliseconds

# Logging Configuration
logging:
  file:
    name: /app/logs/gateway.log
    path: /app/logs/
  level:
    com.example.gateway: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG

# Security Scanner Service URL
scanner:
  service:
    url: ${SCANNER_URL:http://security-scanner:8000}

# Actuator endpoints for monitoring
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
